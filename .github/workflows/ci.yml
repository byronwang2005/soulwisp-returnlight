name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check commit validator
        run: node scripts/check-commit.mjs --self-test
      - name: Test commit history checker
        run: node scripts/check-commit-history.mjs --self-test
      - name: Fetch exact event commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            commits=("$PUSH_BEFORE" "$PUSH_AFTER")
          else
            commits=("$PR_BASE" "$PR_HEAD")
          fi
          for sha in "${commits[@]}"; do
            if [[ ! "$sha" =~ ^[a-fA-F0-9]{40}$ || "$sha" =~ ^0+$ ]]; then
              continue
            fi
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$sha"
            fi
          done
      - name: Check introduced commit messages
        run: node scripts/check-commit-history.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Test game rules
        env:
          AUTH_SECRET: ci-test-only-placeholder-not-a-production-secret
        run: npm exec vitest run tests/rules.test.ts tests/deployment.test.ts tests/room-voice-gate.test.ts tests/voice-lobby-service.test.ts tests/music.test.ts tests/lobby-camera.test.ts tests/lobby-camera-client.test.ts tests/lobby-camera-api.test.ts tests/lobby-panel.test.ts
      - name: Build production packages
        run: npm run build
