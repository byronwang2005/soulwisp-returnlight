name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check commit validator
        run: node scripts/check-commit.mjs --self-test
      - name: Test commit history checker
        run: node scripts/check-commit-history.mjs --self-test
      - name: Check introduced commit messages
        run: node scripts/check-commit-history.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Test game rules
        run: npm exec vitest run tests/rules.test.ts
      - name: Build production packages
        run: npm run build
