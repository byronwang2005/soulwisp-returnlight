name: minecraft-create
services:
  minecraft:
    image: itzg/minecraft-server:java21@sha256:6711f4310d536aeac9dc16baa387b3957ed903890e21ed0b766019439be5c12b
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: ${MINECRAFT_VERSION:?render the connection configuration}
      NEOFORGE_VERSION: ${MINECRAFT_LOADER_VERSION:?render the connection configuration}
      MEMORY: ""
      INIT_MEMORY: 2G
      MAX_MEMORY: 5G
      JVM_XX_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      JVM_OPTS: "-Xlog:gc*:logs/gc.log:time,uptime:filecount=5,filesize=5M"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: ${MINECRAFT_WHITELIST:-}
      MAX_PLAYERS: ${MINECRAFT_MAX_PLAYERS:?render the connection configuration}
      DIFFICULTY: ${MINECRAFT_DIFFICULTY:-normal}
      RESOURCE_PACK: ${MINECRAFT_RESOURCE_PACK:-}
      RESOURCE_PACK_SHA1: ${MINECRAFT_RESOURCE_PACK_SHA1:-}
      RESOURCE_PACK_ENFORCE: ${MINECRAFT_RESOURCE_PACK_ENFORCE:-FALSE}
      RESOURCE_PACK_PROMPT: "星冕·终焉：原创武器外观与动画，无需额外模组"
      MODE: survival
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_QUERY: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD:?set a private RCON password}
      MOTD: "Friends / Create 1.0.5 / ${MINECRAFT_VERSION} / Whitelist"
      TZ: Europe/London
    volumes: ["./data:/data"]
    ports: ["${MINECRAFT_BIND_IP:?render the connection configuration}:25565:25565/tcp"]
    mem_limit: 6656m
    memswap_limit: 6656m
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backup:
    image: itzg/mc-backup@sha256:5a572dd1bf3e4f17e81e62fbd1c6a3c1b1c40bc7b198b41ff6041a84aa24808f
    environment:
      RCON_HOST: minecraft
      RCON_PASSWORD: ${RCON_PASSWORD:?set a private RCON password}
      BACKUP_INTERVAL: 24h
      INITIAL_DELAY: 2m
      PRUNE_BACKUPS_DAYS: "0"
      PRUNE_BACKUPS_COUNT: "7"
      PRE_SAVE_ALL_SCRIPT: "rcon-cli chunky pause"
      POST_BACKUP_SCRIPT: "rcon-cli chunky continue"
      TZ: Europe/London
    depends_on:
      minecraft: {condition: service_healthy}
    volumes: ["./data:/data:ro", "./backups:/backups"]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
